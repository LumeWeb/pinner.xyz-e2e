services:
  mysql:
    image: percona/percona-server:8.4
    container_name: portal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - e2e-network

  maildev:
    image: maildev/maildev:latest
    container_name: portal-maildev
    ports:
      - "1025:1025"
      - "1080:1080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - e2e-network

  gofakes3:
    image: ghcr.io/lumeweb/gofakes3:latest
    container_name: portal-gofakes3
    ports:
      - "9000:9000"
    environment:
      GOF3_BACKEND: mem
      GOF3_INITIAL_BUCKET: fakebucket
      GOF3_NO_INTEGRITY: "true"
      GOF3_QUIET: "true"
    volumes:
      - gofakes3-data:/data
    networks:
      - e2e-network

  ipfs:
    image: ipfs/kubo:latest
    container_name: portal-ipfs
    network_mode: host
    environment:
      - IPFS_PROFILE=test
    healthcheck:
      test: ["CMD-SHELL", "ipfs id > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  powerdns:
    image: powerdns/pdns-auth-51:latest
    container_name: portal-powerdns
    ports:
      - "8081:8081"
    environment:
      PDNS_AUTH_API_KEY: "secret-api-key-for-testing"
      PDNS_AUTH_WEBSERVER_ADDRESS: "0.0.0.0"
      PDNS_AUTH_WEBSERVER_PORT: "8081"
      PDNS_AUTH_WEBSERVER_ALLOW_FROM: "0.0.0.0/0"
      PDNS_AUTH_LOGLEVEL: "notice"
    volumes:
      - powerdns-data:/var/lib/powerdns
    networks:
      - e2e-network

  # This container waits for all services to be healthy
  services-ready:
    image: alpine:latest
    container_name: services-ready
    depends_on:
      mysql:
        condition: service_healthy
      maildev:
        condition: service_healthy
      gofakes3:
        condition: service_started
      ipfs:
        condition: service_healthy
      powerdns:
        condition: service_started
    command: ["sh", "-c", "exit 0"]
    networks:
      - e2e-network

volumes:
  gofakes3-data:
  powerdns-data:

networks:
  e2e-network:
    driver: bridge
