# Portal Configuration for MySQL Mode
core:
  domain: "localhost"
  portal_name: "test-portal"
  port: 8080
  secure: false
  post_upload_limit: 104857600
  dns_resolver: "127.0.0.1:5353"

core.db:
  type: "mysql"
  host: "127.0.0.1"
  port: 3306
  username: "portal"
  password: "portal"
  name: "portal"
  charset: "utf8mb4"

core.log:
  level: "debug"

core.mail:
  host: "127.0.0.1"
  port: 1025
  ssl: false
  auth_type: "none"
  username: "test"
  password: "test"
  from: "test@localhost"

core.storage.sia:
  url: ""
  key: ""

core.storage.s3:
  buffer_bucket: "fakebucket"
  endpoint: "http://localhost:9000"
  region: "us-east-1"
  access_key: "FAKEACCESSKEY"
  secret_key: "FAKESECRETKEY"

# IPFS P2P configuration - use port 4002 to avoid conflict with Kubo's port 4001
plugin.ipfs.api:
  gateway_secret: secret
plugin.ipfs.protocol:
  listen_addresses:
    - "/ip4/0.0.0.0/tcp/4002"
    - "/ip4/0.0.0.0/udp/4002"
  dht_mode: basic

# PowerDNS configuration for DNS service
plugin.ipfs.service.dns:
  enabled: true
  nameservers:
      - ns1.portal.com.
      - ns2.portal.com.
  powerdns_api_url: "http://localhost:8081/api/v1"
  powerdns_api_key: "secret-api-key-for-testing"

# Website service configuration with janitor settings
plugin.ipfs.service.website:
  janitor_enabled: true
  check_interval: 10s  # Short interval for E2E testing
  janitor_worker_count: 10
  janitor_batch_size: 500

# WARNING: This is a TEST seed for CI/CD purposes only.
# This seed is INTENTIONALLY COMPROMISED and MUST NOT be used in production.
# DO NOT use this seed for any real deployments or secure operations.
core.identity: "victory coin oven horn blade sausage large jungle differ talent coral jewel"
core.node_id: "00000000-0000-0000-0000-000000000000"
