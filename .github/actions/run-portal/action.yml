name: 'Run Portal'
description: 'Run the built portal binary and verify it starts successfully'

runs:
  using: 'composite'
  steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: portal-build

    - name: Run Portal
      shell: bash
      run: |
        chmod +x ./scripts/run-portal.sh
        ./scripts/run-portal.sh true
