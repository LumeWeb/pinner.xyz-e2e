name: 'Setup Environment'
description: 'Generate environment variables from YAML configurations'

inputs:
  db_type:
    description: 'Database type (sqlite or mysql)'
    required: false
    default: 'mysql'
    type: string
  renterd_url:
    description: 'Renterd URL endpoint'
    required: true
  renterd_api_password:
    description: 'Renterd API authentication password'
    required: true
  indexd_admin_url:
    description: 'Indexd admin API URL'
    required: false
    default: ''
  indexd_admin_key:
    description: 'Indexd admin API key'
    required: false
    default: ''
  indexd_app_url:
    description: 'Indexd app API URL'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Generate Environment Variables
      shell: bash
      env:
        RENTERD_URL: ${{ inputs.renterd_url }}
        RENTERD_API_PASSWORD: ${{ inputs.renterd_api_password }}
        INDEXD_ADMIN_URL: ${{ inputs.indexd_admin_url }}
        INDEXD_ADMIN_KEY: ${{ inputs.indexd_admin_key }}
        INDEXD_APP_URL: ${{ inputs.indexd_app_url }}
      run: |
        chmod +x ./scripts/setup-env.sh
        ./scripts/setup-env.sh "${{ inputs.db_type }}" true