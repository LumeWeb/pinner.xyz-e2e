name: 'Start Portal'
description: 'Start the portal binary in background for E2E testing'

inputs:
  log_file:
    description: 'Path to log file'
    required: false
    default: '.portal.log'
  renterd_url:
    description: 'Renterd URL endpoint'
    required: true
  renterd_api_password:
    description: 'Renterd API authentication password'
    required: true

outputs:
  log_file:
    description: 'Path to log file'
    value: ${{ inputs.log_file }}

runs:
  using: 'composite'
  steps:
    - name: Start Portal
      shell: bash
      env:
        VERBOSE: ${{ runner.debug == '1' && '1' || '0' }}
        RENTERD_URL: ${{ inputs.renterd_url }}
        RENTERD_API_PASSWORD: ${{ inputs.renterd_api_password }}
      run: |
        # Ensure portal is in the expected location
        if [ ! -f "./portal" ] && [ -f "./dist/portal" ]; then
          cp ./dist/portal ./portal
          chmod +x ./portal
        fi
        
        # Wait for MySQL
        chmod +x ./scripts/wait-mysql.sh
        ./scripts/wait-mysql.sh
        
        # Start DNS server (required for portal routing)
        chmod +x ./scripts/ensure-venv.sh
        ./scripts/ensure-venv.sh
        chmod +x ./scripts/start-dns.sh
        ./scripts/start-dns.sh
        
        # Start portal in background with logging (PORTAL_PORT from .env or default to 8080)
        chmod +x ./scripts/start-portal.sh
        /bin/bash ./scripts/start-portal.sh ${{ inputs.log_file }}
