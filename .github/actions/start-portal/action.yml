name: 'Start Portal'
description: 'Start the portal binary in background for E2E testing'

inputs:
  log_file:
    description: 'Path to log file'
    required: false
    default: '.portal.log'
  renterd_url:
    description: 'Renterd URL endpoint'
    required: true
  renterd_api_password:
    description: 'Renterd API authentication password'
    required: true
  indexd_admin_url:
    description: 'Indexd admin API URL'
    required: false
    default: ''
  indexd_admin_key:
    description: 'Indexd admin API key'
    required: false
    default: ''
  indexd_app_url:
    description: 'Indexd app API URL'
    required: false
    default: ''

outputs:
  log_file:
    description: 'Path to log file'
    value: ${{ inputs.log_file }}

runs:
  using: 'composite'
  steps:
    - name: Start Portal
      shell: bash
      env:
        VERBOSE: ${{ runner.debug == '1' && '1' || '0' }}
        RENTERD_URL: ${{ inputs.renterd_url }}
        RENTERD_API_PASSWORD: ${{ inputs.renterd_api_password }}
        INDEXD_ADMIN_URL: ${{ inputs.indexd_admin_url }}
        INDEXD_ADMIN_KEY: ${{ inputs.indexd_admin_key }}
        INDEXD_APP_URL: ${{ inputs.indexd_app_url }}
      run: |
        # Ensure portal is in the expected location
        if [ ! -f "./portal" ] && [ -f "./dist/portal" ]; then
          cp ./dist/portal ./portal
          chmod +x ./portal
        fi
        
        # Wait for MySQL
        chmod +x ./scripts/wait-mysql.sh
        ./scripts/wait-mysql.sh
        
        # Start DNS server (required for portal routing)
        chmod +x ./scripts/ensure-venv.sh
        ./scripts/ensure-venv.sh
        chmod +x ./scripts/start-dns.sh
        ./scripts/start-dns.sh
        
        # Setup Kubo bootstrap (before starting portal)
        chmod +x ./scripts/setup-kubo-bootstrap.sh
        ./scripts/setup-kubo-bootstrap.sh
        
        # Start stripe-mock server (required for billing tests)
        chmod +x ./scripts/start-stripe-mock.sh
        ./scripts/start-stripe-mock.sh
        
        # Start atlos-mock server (required for billing tests)
        chmod +x ./scripts/start-atlos-mock.sh
        ./scripts/start-atlos-mock.sh
        
        # Start portal in background with logging (PORTAL_PORT from .env or default to 8080)
        chmod +x ./scripts/start-portal.sh
        /bin/bash ./scripts/start-portal.sh ${{ inputs.log_file }}
