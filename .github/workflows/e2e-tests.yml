name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build Portal
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Create Plugin Manifest
      run: |
        chmod +x ./scripts/create-plugin-manifest.sh
        ./scripts/create-plugin-manifest.sh
    
    - name: Build Portal
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/lumeweb/portal-builder:ubuntu
        options: -v ${{ github.workspace }}:/workspace -v ${{ github.workspace }}/dist:/dist
        run: build-portal
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portal-build
        path: dist/portal
        retention-days: 1

  run:
    name: Run Portal (MySQL)
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mysql:
        image: percona/percona-server:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: portal
          MYSQL_USER: portal
          MYSQL_PASSWORD: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      maildev:
        image: maildev/maildev:latest
        ports:
          - 1025:1025
          - 1080:1080
        options: >-
          --health-cmd="wget --spider -q http://localhost:1080"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      gofakes3:
        image: johannesboyne/gofakes3:latest
        ports:
          - 9000:9000
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: portal-build
        path: dist/
    
    - name: Setup Environment
      uses: ./.github/actions/setup-env
      env:
        RENTERD_URL: ${{ secrets.RENTERD_URL }}
        RENTERD_API_PASSWORD: ${{ secrets.RENTERD_API_PASSWORD }}
    
    - name: Wait for Services
      run: |
        chmod +x ./scripts/wait-gofakes3.sh
        ./scripts/wait-gofakes3.sh
    
    - name: Start Portal
      uses: ./.github/actions/start-portal
      id: portal
    
    - name: Wait for Portal
      run: |
        chmod +x ./scripts/wait-portal.sh
        ./scripts/wait-portal.sh
    
    - name: Run E2E Tests
      run: |
        chmod +x ./scripts/run-tests.sh
        ./scripts/run-tests.sh
    
    - name: Portal Logs
      if: always()
      run: |
        if [ -f ${{ steps.portal.outputs.log_file }} ]; then
          echo "=== Portal Logs ==="
          cat ${{ steps.portal.outputs.log_file }} || true
        fi
