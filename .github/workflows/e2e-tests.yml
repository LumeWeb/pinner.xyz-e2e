name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build Portal
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Create Plugin Manifest
      run: |
        chmod +x ./scripts/create-plugin-manifest.sh
        ./scripts/create-plugin-manifest.sh

    - name: Build Portal
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/lumeweb/portal-builder:ubuntu
        options: -v ${{ github.workspace }}:/workspace -v ${{ github.workspace }}/dist:/dist
        run: build-portal

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portal-build
        path: dist/portal
        retention-days: 1

  discover-features:
    name: Discover Feature Files
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Build feature matrix
      id: set-matrix
      run: |
        FEATURES=$(ls features/*.feature 2>/dev/null | xargs -I{} basename {} .feature | sort)
        if [ -z "$FEATURES" ]; then
          echo "No feature files found" >&2
          echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          exit 1
        fi

        MATRIX=$(echo "$FEATURES" | jq -R -s -c '{"include": [split("\n") | .[] | select(length > 0) | {"feature": .}]}')
        echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
        echo "Discovered features:"
        echo "${MATRIX}" | jq .

  test:
    name: "Test: ${{ matrix.feature }}"
    needs: [build, discover-features]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-features.outputs.matrix) }}
    uses: ./.github/workflows/run-e2e-shard.yml
    with:
      feature: ${{ matrix.feature }}
    secrets: inherit

  compliance:
    name: IPFS Compliance Tests
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    uses: ./.github/workflows/run-e2e-shard.yml
    with:
      feature: ''
    secrets: inherit
