# Minimal Portal Configuration for CI Testing

core:
  domain: "localhost"
  portal_name: "test-portal"
  port: 8080
  secure: false
  post_upload_limit: 104857600
  dns_resolver: "127.0.0.1:5353"

# core.db:
#   type: "sqlite"
#   file: "portal.db"

core.log:
  level: "debug"

core.mail:
  host: "localhost"
  port: 25
  ssl: false
  tls_policy: "NoTLS"
  auth_type: "none"
  username: "test"
  password: "test"
  from: "test@localhost"

# Renterd configuration - these MUST be set as environment variables
# Required: RENTERD_URL, RENTERD_API_PASSWORD
core.storage.sia:
  url: ""
  key: ""

# S3 configuration for gofakes3 mock service
core.storage.s3:
  buffer_bucket: "fakebucket"
  endpoint: "http://localhost:9000"
  region: "us-east-1"
  access_key: "FAKEACCESSKEY"
  secret_key: "FAKESECRETKEY"
