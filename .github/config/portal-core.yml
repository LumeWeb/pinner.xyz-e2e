# Minimal Portal Configuration for CI Testing

core:
  domain: "localhost"
  portal_name: "test-portal"
  port: 8080
  secure: false
  post_upload_limit: 104857600

# core.db:
#   type: "sqlite"
#   file: "portal.db"

core.log:
  level: "debug"

core.mail:
  host: "localhost"
  port: 25
  ssl: false
  auth_type: "none"
  username: "test"
  password: "test"
  from: "test@localhost"

# Renterd configuration - these MUST be set as environment variables
# Required: RENTERD_URL, RENTERD_API_PASSWORD, RENTERD_SEED
core.storage.sia:
  url: ""
  api_password: ""
  seed: ""

# WARNING: This is a TEST seed for CI/CD purposes only.
# This seed is INTENTIONALLY COMPROMISED and MUST NOT be used in production.
# DO NOT use this seed for any real deployments or secure operations.
core.identity: "victory coin oven horn blade sausage large jungle differ talent coral jewel"
